[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
# nix-ld loader: a /nix/store glibc interpreter dies with the next nix GC
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=native", "-C", "link-arg=-Wl,--dynamic-linker=/lib64/ld-linux-x86-64.so.2"]

[registries.crates-io]
protocol = "sparse"

[unstable]
gc = true

[profile.release]
opt-level = 3
strip = true

[profile.profiling]
inherits = "release"
debug = true
