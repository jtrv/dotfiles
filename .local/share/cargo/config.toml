[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=native"]

[registries.crates-io]
protocol = "sparse"

[unstable]
gc = true

[profile.release]
opt-level = 3
strip = true

[profile.profiling]
inherits = "release"
debug = true
