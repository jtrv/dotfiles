# baijia-suo example configuration
#
# Place at ~/.config/baijia-suo/config.toml or /etc/baijia-suo/config.toml
# (or pass an explicit path with -C). Command-line flags override values
# set here. All keys are optional; uncomment to use.

# Background color, RRGGBB or RRGGBBAA
# color = "a3a3a3ff"

# Background animation.
# Choose an animation or list multiple to shuffle with `cycle` seconds of
# airtime for each one in the list.
animation = "random" # All the flavors!
