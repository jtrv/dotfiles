[misc]
# Don't ask for confirmations
assume_yes = true

notify_each_step = true

# Disable specific steps - same options as the command line flag
disable = ["containers", "protonup", "kakoune", "uv", "yazi"]

# Ignore failures for these steps
ignore_failures = ["git_repos"]

# Run specific steps - same options as the command line flag
#only = ["system", "emacs"]

# Do not ask to retry failed steps (default: false)
#no_retry = true

# Do not set the terminal title
#set_title = false

# Cleanup temporary or old files
cleanup = true

[git]
max_concurrency = 10
# Additional git repositories to pull
repos = [
    "~/repos/*",
]

# Arguments to pass Git when pulling Repositories
#arguments = "--rebase --autostash"

[composer]
self_update = true

# Commands to run before anything
[pre_commands]
"snapper snapshot" = "sudo snapper -c root create -c number -d topgrade"

# Custom commands
[commands]
"arch audit" = "arch-audit -C always -r -f '%n	%t	%r' | column -s '	' -t | $EDITOR"
"kakoune" = "pushd ~/repos/kakoune/; sudo make install; popd; kak -ui dummy -e 'hook global User bundle-after-install %{ quit! }; bundle-update'"
"tree-sitter" = "ktsctl sync -a"
"uv tools" = "uv tool upgrade --all"
"yazi" = "ya pkg upgrade"
"warehouse" = "warehouse"

[linux]
arch_package_manager = "paru"
enable_tlmgr = true
