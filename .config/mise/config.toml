# https://mise.jdx.dev/registry.html
# global tools now come from nix (systemPackages) - keeping them here too means
# mise shims shadow the nix copies. only tools nix doesn't provide stay global;
# per-project versions still work via .mise.toml.
[tools]
aichat = "latest"
ruby = "latest"   # no ruby interpreter in packages.nix, only the LSPs
usage = "latest"  # mise completion dependency
herdr = "latest"

[settings]
plugin_autoupdate_last_check_duration = '1 day'
env_file = '.env'
idiomatic_version_file_enable_tools = [ 'crystal', 'elixir', 'go', 'java', 'node', 'python', 'ruby', 'terraform', 'yarn' ]
experimental = true
