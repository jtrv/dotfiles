# https://mise.jdx.dev/registry.html
[tools]
aichat = "latest"
biome = "latest"
bun = "latest"
cargo-binstall = "latest"
dotenv-linter = "latest"
herdr = "latest"
node = "latest"
revive = "latest"
usage = "latest"
uv = "latest"
zig = "latest"

[settings]
env_file = '.env'
idiomatic_version_file_enable_tools = [ 'crystal', 'elixir', 'java', 'node', 'python', 'ruby', 'terraform', 'yarn' ]
experimental = true
# NixOS defaults to compiling python and node from source; nix-ld runs the prebuilt ones
python.compile = false
node.compile = false
