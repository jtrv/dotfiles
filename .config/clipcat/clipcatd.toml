daemonize = false
max_history = 100
# RAM only (tmpfs): nothing copied survives a reboot or lands in snapshots/backups
history_file_path = "/run/user/1000/clipcatd-history"
clear_history_on_start = true

[log]
# Emit log message to systemd-journald.
emit_journald = true
# Log level
level = "INFO"

[watcher]
# Enable watching X11/Wayland clipboard selection.
enable_clipboard = true
# Enable watching X11/Wayland primary selection.
enable_primary = false
# Ignore clips which match with one of the X11 `TARGETS`.
sensitive_mime_types = ["x-kde-passwordManagerHint"]
# Ignore text clips which match with one of the regular expressions.
# Rust `regex` crate: no lookaround. Token shapes are from gitleaks' config/gitleaks.toml.
denied_text_regex_patterns = [
  '^\s*\d{6}\s*$',                                        # 2FA codes
  '-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY',
  'AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}',
  '\bsk-(ant|or|proj|svcacct|admin)-[A-Za-z0-9_-]{20,}',  # Anthropic, OpenRouter, OpenAI
  '\bgsk_[A-Za-z0-9]{40,}\b',                             # Groq
  '\b(A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b',    # AWS
  '\bgh[pousr]_[0-9a-zA-Z]{36}\b',
  '\bgithub_pat_\w{82}',
  '\bglpat-[\w-]{20}',
  '\bxox[abprs]-[0-9A-Za-z-]{10,}',                       # Slack
  '\b(sk|rk)_(test|live|prod)_[a-zA-Z0-9]{10,99}',        # Stripe
  '\bAIza[\w-]{35}',                                      # Google
  '\bnpm_[A-Za-z0-9]{36}\b',
  '\bhf_[A-Za-z]{34}\b',
  'pypi-AgEIcHlwaS5vcmc[\w-]{50,}',
  '\bey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9/_-]{17,}\.',        # JWT
]
# Ignore text clips with a length <= `filter_text_min_length`, in characters (Unicode scalar value), not in byte.
filter_text_min_length = 1
# Ignore text clips with a length > `filter_text_max_length`, in characters (Unicode scalar value), not in byte.
filter_text_max_length = 20000000
# Enable capturing image or not.
capture_image = true
# Ignore image clips with a size > `filter_image_max_size`, in byte.
filter_image_max_size = 5242880

[dbus]
# Enable D-Bus.
enable = true

[desktop_notification]
# Enable desktop notification.
enable = true
# Timeout duration in milliseconds.
# This sets the time from the time the notification is displayed until it is
# closed again by the notification server.
timeout_ms = 2000
# Define the length of a long plaintext,
# if the length of a plaintext is >= `long_plaintext_length`,
# desktop notification will be emitted.
# If this value is 0, no desktop desktop notification will be emitted when fetched a long plaintext.
long_plaintext_length = 2000
