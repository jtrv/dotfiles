# Environment for the graphical session. Read by the systemd user manager, so
# these reach niri and every GUI app it spawns - env.fish only reaches fish and
# its children, and the greeter starts niri outside any fish login shell.
#
# Only vars that GUI apps actually need live here. Shell/CLI vars (XDG bases,
# tool homes, pagers, carapace, fzf/skim) stay in fish/conf.d/env.fish. Dual-use
# vars (EDITOR/VISUAL/BROWSER/TERMINAL) are ALSO kept in env.fish so bare TTY
# logins - which don't inherit env.d - still get them.
#
# (thiccpad/nixos sets the same vars via environment.sessionVariables instead.)

# theming (Qt + GTK apps, cursor)
QT_QPA_PLATFORMTHEME=qt6ct
QT_STYLE_OVERRIDE=kvantum
GTK2_RC_FILES=${HOME}/.config/gtk-2.0/gtkrc
XCURSOR_PATH=/usr/share/icons:${HOME}/.local/share/icons

# wayland
MOZ_ENABLE_WAYLAND=1

# default apps (also set in env.fish for shells / TTY logins)
BROWSER=firefox
TERMINAL=alacritty
EDITOR=kak
VISUAL=kak

# bemoji (niri spawns it: Mod+Shift+E). single-quoted so the font's inner
# double quotes survive systemd's quote removal. wtype = wayland-native typing,
# no daemon/uinput unlike ydotool.
BEMOJI_PICKER_CMD='tofi --font="BlexMono Nerd Font, Noto Color Emoji" --horizontal=true'
BEMOJI_CLIP_CMD=wl-copy
BEMOJI_TYPE_CMD=wtype
