"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin: sets the active palette. Palette tables MUST be defined after this
# line -- see the [palettes.*] blocks at the end of this file.
palette = "catppuccin_mocha"

format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$nats\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
$docker_context\
$package\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$guix_shell\
$nix_shell\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$direnv\
$env_var\
$mise\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$container\
$netns\
$os\
$shell\
$character"""
[aws]
format = 'on [($profile )($region)$symbol]($style)'
style = "bold yellow"
symbol = "☁️  "
disabled = true

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold green)"

[directory]
fish_style_pwd_dir_length = 1

# docker
[docker_context]
symbol = "🐋 "
disabled = false

[gcloud]
format = '[$symbol$account(@$domain)(\($project\))]($style) '
style = "bold yellow"
symbol = "☁️  "
disabled = true

# git
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
commit_hash_length = 4

[git_metrics]
disabled = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold"
conflicted = '[=$count](dimmed bold red) '
ahead      = '[⇡$count](dimmed bold mauve) '
behind     = '[⇣$count](dimmed bold mauve) '
diverged   = '[⇡$ahead_count⇣$behind_count](dimmed bold mauve) '
untracked  = '[?$count](dimmed bold blue) '
stashed    = '[≡$count](dimmed bold teal) '
modified   = '[!$count](dimmed bold yellow) '
staged     = '[+$count](dimmed bold green) '
renamed    = '[»$count](dimmed bold peach) '
deleted    = '[✘$count](dimmed bold red) '

# hostname
[hostname]
disabled = true

# kubernetes
[kubernetes]
symbol = "⛵ "
style = "dimmed green"
disabled = false
[kubernetes.context_aliases]
"dev.local.cluster.k8s" = "dev"

[sudo]
disabled = false

[terraform]
disabled = false

