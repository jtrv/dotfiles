# task
[language.task.grammar]
path = "src"
compile = "sccache"
compile_args = ["cc", "-c", "-fpic", "../parser.c", "-I", ".."]
compile_flags = ["-O3"]
link = "cc"
link_args = ["-shared", "-fpic", "parser.o", "-o", "task.so"]
link_flags = ["-fuse-ld=mold", "-O3"]

