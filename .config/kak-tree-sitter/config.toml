# asciidoc
[grammar.asciidoc]
source.git.url = "https://github.com/cathaysia/tree-sitter-asciidoc"
source.git.pin = "5b6ccea9953b939959f447f7bfea699ae6968a99"
path = "tree-sitter-asciidoc/src"
compile = "sccache"
compile_args = ["cc", "-c", "-fpic", "../scanner.c", "../parser.c", "-I", ".."]
compile_flags = ["-O3"]
link = "cc"
link_args = ["-shared", "-fpic", "scanner.o", "parser.o", "-o", "asciidoc.so"]
