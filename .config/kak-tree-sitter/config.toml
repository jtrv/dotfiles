# Merged over kak-tree-sitter's built-in config (`ktsctl default-config`): list only
# additions and overrides here. A copy of the full default drifts from the pinned
# grammars and breaks their builds.

[highlight]
# The rest are nvim-treesitter capture names, used by queries such as sql, scala,
# hare, hcl, ron, swift and graphql. Without a group those captures render plain;
# kakrc links their ts_* faces to the helix-named equivalents.
groups = [
  "function.definition",
  "keyword.import",
  "boolean",
  "character",
  "conditional",
  "escape",
  "exception",
  "field",
  "float",
  "markup.link",
  "markup.list",
  "markup.strong",
  "method",
  "module",
  "number",
  "parameter",
  "property",
  "repeat",
  "storageclass",
]

# Kakoune names these filetypes differently from kak-tree-sitter's languages, so
# without the alias they never get tree-sitter highlighting.
[language.make]
aliases = ["makefile"]

[language.just]
aliases = ["justfile"]

[language.ini]
aliases = ["systemd"]

[language.bash]
aliases = ["sh", "env"]

# Local query dirs: the upstream query source ships no textobjects.scm, so each
# vendors its upstream queries at the installed pin and adds one. Re-copy them
# when bumping that language's grammar pin.

# helix 7275b7f queries plus helix master textobjects.scm
[language.css.queries.source.local]
path = "/home/sugimoto/.config/kak-tree-sitter/queries/css"

# asciidoc
[grammar.asciidoc.source.git]
url = "https://github.com/cathaysia/tree-sitter-asciidoc"
pin = "master"

[grammar.asciidoc]
path = "tree-sitter-asciidoc/src"
compile_args = ["-c", "-fpic", "../scanner.c", "../parser.c", "-I", ".."]
link_args = ["-shared", "-fpic", "scanner.o", "parser.o", "-o", "{lang}.so"]

[language.asciidoc.queries]
path = "tree-sitter-asciidoc/queries"

[language.asciidoc.queries.source.git]
