compile_args = ["cc", "-c", "-fpic", "../parser.c", "-I", ".."]
compile_flags = ["-O3"]
link = "cc"
link_args = ["-shared", "-fpic", "parser.o", "-o", "tsv.so"]
link_flags = ["-O3"]

[language.tsv]
grammar = "tsv"

[language.tsv.queries]
source.git.url = "https://github.com/tree-sitter-grammars/tree-sitter-csv"
source.git.pin = "master"
path = "tsv/queries"

