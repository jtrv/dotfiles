# typescript
[grammar.typescript]
path = "typescript/src"
compile = "sccache"
compile_args = ["cc", "-c", "-fpic", "../scanner.c", "../parser.c", "-I", ".."]
compile_flags = ["-fuse-ld=mold", "-O3"]
