matches:
  # FUNCTION DEFINITIONS
  - trigger: ",,gfn"
    label: "go: func"
    replace: |
      func $|$() {
      }

  - trigger: ",,gin"
    label: "go: func init"
    replace: |
      func init() {
        $|$
      }

  - trigger: ",,gmn"
    label: "go: package main + func main"
    replace: |
      package main

      import (
      )

      func main() {
        $|$
      }

  # CONTROL STRUCTURES
  - trigger: ",,gf+"
    label: "go: for loop counting up"
    replace: |
      for i := 0; i < $|$; i++ {
      }

  - trigger: ",,gf-"
    label: "go: for loop counting down"
    replace: |
      for i := 0; i > $|$; i-- {
      }

  - trigger: ",,gfr"
    label: "go: for range"
    replace: |
      for _, v := range $|$ {
      }

  - trigger: ",,gse"
    label: "go: select"
    replace: |
      select {
      case $|$:

      default:

      }

  - trigger: ",,gsw"
    label: "go: switch"
    replace: |
      switch {
      case $|$:

      default:

      }

  # TYPE DEFINITIONS
  - trigger: ",,gif"
    label: "go: interface type"
    replace: |
      type $|$ interface {
      }

  - trigger: ",,gst"
    label: "go: struct type"
    replace: |
      type $|$ struct {
      }

  # ERROR HANDLING AND DEFERRED EXECUTION
  - trigger: ",,gde"
    label: "go: defer"
    replace: |
      defer $|$()

  - trigger: ",,ger"
    label: "go: if err != nil"
    replace: |
      if err != nil {
        return $|$
      }

  # PRINTING AND FORMATTING
  - trigger: ",,gpf"
    label: "go: fmt.Printf"
    replace: |
      fmt.Printf("$|$\n")

  - trigger: ",,gpl"
    label: "go: fmt.Println"
    replace: |
      fmt.Println($|$)

  # DATA STRUCTURES
  - trigger: ",,gap"
    label: "go: append to slice"
    replace: |
      slice = append(slice, $|$)  // assign back: append may return a new backing array

  - trigger: ",,gma"
    label: "go: map literal"
    replace: |
      map[string]$|${}

  - trigger: ",,gsl"
    label: "go: slice literal"
    replace: |
      []$|${}

  # GOROUTINES AND CHANNELS
  - trigger: ",,gch"
    label: "go: make channel"
    replace: |
      ch := make(chan $|$)

  - trigger: ",,ggo"
    label: "go: goroutine"
    replace: |
      go func() {
        $|$
      }()

  # TESTING
  - trigger: ",,gbe"
    label: "go: benchmark func"
    replace: |
      func Benchmark$|$(b *testing.B) {
        for i := 0; i < b.N; i++ {

        }
      }

  - trigger: ",,gte"
    label: "go: test func"
    replace: |
      func Test$|$(t *testing.T) {
      }

  # JSON MARSHALING/UNMARSHALING
  - trigger: ",,gjm"
    label: "go: json.Marshal"
    replace: |
      jsonData, err := json.Marshal($|$)
      if err != nil {
        log.Fatal(err)
      }

  - trigger: ",,gju"
    label: "go: json.Unmarshal"
    replace: |
      err := json.Unmarshal(data, &$|$)
      if err != nil {
        log.Fatal(err)
      }
